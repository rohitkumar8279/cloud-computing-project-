name = "campuscare-lite"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Static UI (public/ folder) is served by Cloudflare; API calls go to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Daily report: 8:00 AM IST = 02:30 UTC. For a live demo use "* * * * *".
[triggers]
crons = ["30 2 * * *"]

# Serverless database (D1). After `wrangler d1 create campuscare-db`,
# paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "campuscare-db"
database_id = "REPLACE_WITH_DATABASE_ID"
